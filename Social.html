<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Munnaj Nasir | Social Designs</title>



  <style>

    body {

      background-color: #F8F9FB;

      color: #1A202C;

      margin: 0;

      padding: 0;

      line-height: 1.7;

      font-family: 'Inter', sans-serif;

    }




    .hamburger {

      display: none;

      font-size: 1.8rem;

      color: #1A202C;

      cursor: pointer;

    }



    @media (max-width: 768px) {

      nav {

        position: absolute;

        top: 70px;

        right: 0;

        background-color: #ffffff;

        flex-direction: column;

        width: 200px;

        padding: 1rem;

        display: none;

      }



      nav.show {

        display: flex;

      }



      .hamburger {

        display: block;

      }

    }



    .masonry-grid {

      columns: 4 300px;

      column-gap: 1.5rem;

      padding: 2rem;

    }



    .grid-item {

      break-inside: avoid;

      margin-bottom: 1.5rem;

      background: #ffffff;

      border-radius: 12px;

      overflow: hidden;

      box-shadow: 0 0 12px rgba(90, 103, 216, 0.1);

      transition: transform 0.3s;

    }



    .grid-item img {

      width: 100%;

      display: block;

      border-radius: 12px;

    }



    .grid-item:hover {

      transform: scale(1.02);

      box-shadow: 0 0 18px #B794F4;

    }



    footer {

      text-align: center;

      padding: 1.5rem 0;

      background-color: #ffffff;

      color: #718096;

      font-size: 0.9rem;

      margin-top: 3rem;

    }



    @media (max-width: 768px) {

      .masonry-grid {

        columns: 2 150px;

        padding: 1.5rem;

      }

    }

  </style>

</head>

<body>





  <section class="masonry-grid">

    <div class="grid-item"><img src="images/Socialposts/1.jpg" alt="Social Post 1"></div>

    <div class="grid-item"><img src="images/Socialposts/10.jpg" alt="Poster One"></div>

    <div class="grid-item"><img src="images/Socialposts/11.jpg" alt="Poster Two"></div>

    <div class="grid-item"><img src="images/Socialposts/12.jpg" alt="Citrivibe Post"></div>

    <div class="grid-item"><img src="images/Socialposts/14.jpg" alt="Nike Post"></div>

    <div class="grid-item"><img src="images/Socialposts/13.jpg" alt="Design 18"></div>

    <div class="grid-item"><img src="images/Socialposts/15.png" alt="Design 29"></div>

    <div class="grid-item"><img src="images/Socialposts/17.png" alt="Design 24"></div>

    <div class="grid-item"><img src="images/Socialposts/16.jpg" alt="Design 28"></div>

    <div class="grid-item"><img src="images/Socialposts/18 (1).jpg" alt="Design 18"></div>

    <div class="grid-item"><img src="images/Socialposts/2.jpg" alt="Design 29"></div>

    <div class="grid-item"><img src="images/Socialposts/18 (2).jpg" alt="Design 24"></div>

        <div class="grid-item"><img src="images/Socialposts/3.jpg" alt="Design 28"></div>

    <div class="grid-item"><img src="images/Socialposts/5.jpg" alt="Design 18"></div>
